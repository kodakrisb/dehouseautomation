name: Auto Unzip DeHouse to Root
on:
  workflow_dispatch:
  push:
    paths:
      - 'DeHouse-Automation-Launch-Ready.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip to root (flatten wrapper folder)
        run: |
          mkdir temp_extract
          unzip -o "DeHouse-Automation-Launch-Ready.zip" -d temp_extract

          # If zip contained one single top-level folder, move its contents up
          if [ "$(ls temp_extract | wc -l)" -eq 1 ] && [ -d "temp_extract/$(ls temp_extract)" ]; then
            mv temp_extract/*/* .
            mv temp_extract/*/.[!.]* . 2>/dev/null || true
          else
            mv temp_extract/* .
            mv temp_extract/.[!.]* . 2>/dev/null || true
          fi

          rm -rf temp_extract
          rm "DeHouse-Automation-Launch-Ready.zip"


      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-extract DeHouse zip" || echo "No changes"
          git push